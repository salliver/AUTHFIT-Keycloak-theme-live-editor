parent=keycloak
import=common/keycloak
styles=css/login.css

# Brand logo shown above the login form (leave blank to hide)
logoPath=

# ----------------------------------------------------------------
# Customization from the Keycloak admin console
# ----------------------------------------------------------------
# These defaults apply unless overridden per-realm.
#
# The admin console of this theme install includes a "Branding"
# editor (floating button in the admin console, injected by the
# custom "admin" theme in the same folder). Open the admin console
# at /admin/master/console/ and click "Branding" to change the
# values below per realm from the UI (stored as realm attributes
# kc.*). The login page picks them up immediately.
#
# Values can also be set via kcadm.sh / Admin REST API, e.g.:
#
#   docker exec -it keycloak_dev /opt/keycloak/bin/kcadm.sh config credentials \
#       --server http://localhost:8080 --realm master --user admin --password admin
#   docker exec -it keycloak_dev /opt/keycloak/bin/kcadm.sh update realms/master \
#       -s 'attributes.kc.primaryColor=#4f46e5'
#
# Background
#   kc.backgroundType   image | video
#   kc.backgroundFit    cover | contain | fill | auto — how the image/video
#                       fills the visual panel (fill stretches, auto = natural size)
#   kc.backgroundPath   file under login/resources/, e.g. img/my-background.jpg
#                       (stock images are not shipped; drop your own licensed
#                       images into login/resources/img/)
#   kc.backgroundImage  uploaded image (data URI, set via the Branding editor);
#                       takes precedence over backgroundType/backgroundPath
#   kc.bgVisualColor    panel background color, e.g. #0a192f
#   kc.bgOverlayColor   overlay tint color over the image/video
#   kc.bgOverlayOpacity overlay opacity in % (0-100)
# Layout
#   kc.layoutSide       left | right — which side holds the login card
#   kc.formColumnWidth  width of the login card side, e.g. 45%
#   kc.visualColumnWidth width of the background side, e.g. 55%
#                       (keep both near 100% combined; mobile ignores them)
# Brand colors
#   kc.primaryColor     e.g. #2563eb   (buttons, focus ring)
#   kc.primaryHover     e.g. #1d4ed8   (button hover)
#   kc.linkColor        e.g. #2563eb   (links; blank = primary color)
#   kc.textColor        e.g. #0f172a   (main text)
#   kc.textMuted        e.g. #64748b   (secondary text)
#   kc.titleColor       e.g. #0f172a   (page title; blank = text color)
#   kc.bgPage           e.g. #f8fafc   (page background)
#   kc.formBgColor      e.g. #ffffff   (form card background)
#   kc.borderColor      e.g. #e2e8f0   (input/social borders)
#   kc.errorColor       e.g. #dc2626   (error text)
# Surface gradients (for the three colorable surfaces: page, form card, visual panel).
# The mode is solid | gradient; when gradient, the two colors + angle are used and
# the surface var becomes linear-gradient(angle, start, end). start/end blank = solid color.
#   kc.bgPageGradient / kc.bgPageGradientStart / kc.bgPageGradientEnd / kc.bgPageGradientAngle
#   kc.formBgGradient  / kc.formBgGradientStart  / kc.formBgGradientEnd  / kc.formBgGradientAngle
#   kc.bgVisualGradient / kc.bgVisualGradientStart / kc.bgVisualGradientEnd / kc.bgVisualGradientAngle
# Typography
#   kc.fontFamily       e.g. Inter, sans-serif
#   kc.fontUrl          web font stylesheet URL (Google Fonts etc.), loaded when set
#   kc.customFonts      JSON array [{family, stack, url}] of fonts added via the editor
#   kc.titleSize        e.g. 1.5rem
#   kc.labelSize        e.g. 0.9rem
#   kc.inputSize        e.g. 1rem
#   kc.inputPadding     vertical padding of the login fields, e.g. 0.75rem
#   kc.titleWeight      title font weight, e.g. 700
#   kc.labelWeight      field label font weight, e.g. 600
#   kc.inputWeight      input text font weight, e.g. 400
#   kc.buttonWeight     submit button font weight, e.g. 600
# Texts (blank = default message bundle text)
#   kc.loginTitle       heading above the login form, e.g. Welcome back
#   kc.usernameLabel    username / email field label
#   kc.passwordLabel    password field label
#   kc.loginButtonText  submit button label
#   kc.footerText       copyright/footer line under the card, e.g. © 2026 - Marfi srl
# Version tracking (read-only, shown centered in the editor footer; not rendered on the login page)
# Override per realm via kcadm.sh: update realms/<realm> -s 'attributes.kc.buildNumber=1.2.0'
#   kc.buildNumber      e.g. 1.2.0
#   kc.releaseName      e.g. Bunsen
buildNumber=1.2.0
releaseName=Azure Heron
# Logo
#   kc.logoImage        uploaded logo (data URI, set via the Branding editor);
#                       takes precedence over logoPath
#   kc.logoMaxWidth     e.g. 180px
#   kc.logoMaxHeight    e.g. 80px
# Logo position: default | margin | absolute
#   kc.logoPositionMode default (centered) | margin (custom margins) | absolute (over the card)
#   kc.logoMarginTop/Bottom/Left/Right  px margins, only in margin mode (blank = auto)
#   kc.logoPosLeft/Right/Top/Bottom     % coordinates, only in absolute mode,
#                                       anchored to the login card (blank = auto)
# Shape
#   kc.cardMaxWidth     e.g. 420px
#   kc.cardPadding      e.g. 2.5rem
#   kc.cardRadius       e.g. 16px
#   kc.inputRadius      e.g. 8px
#   kc.shadowCard       e.g. 0 10px 40px rgba(15, 23, 42, 0.08)
# Login button style
#   kc.btnWidth         e.g. 100% | auto | 320px
#   kc.btnMinHeight     minimum button height, e.g. 48px
#   kc.btnRadius        button radius (blank = same as input radius)
#   kc.btnTextTransform none | uppercase | capitalize | lowercase
#   kc.btnLetterSpacing e.g. 0.05em
#
# Values above are the default fallbacks below.
# ----------------------------------------------------------------
backgroundType=image
backgroundPath=
backgroundFit=cover
layoutSide=left
formColumnWidth=45%
visualColumnWidth=55%
bgVisualColor=#0a192f
bgOverlayColor=#0a192f
bgOverlayOpacity=40
primaryColor=#2563eb
primaryHover=#1d4ed8
linkColor=
textColor=#0f172a
textMuted=#64748b
titleColor=
bgPage=#f8fafc
formBgColor=#ffffff
borderColor=#e2e8f0
errorColor=#dc2626
bgPageGradient=solid
bgPageGradientStart=
bgPageGradientEnd=
bgPageGradientAngle=135
formBgGradient=solid
formBgGradientStart=
formBgGradientEnd=
formBgGradientAngle=135
bgVisualGradient=solid
bgVisualGradientStart=
bgVisualGradientEnd=
bgVisualGradientAngle=135
fontFamily=Segoe UI, Tahoma, Geneva, Verdana, sans-serif
fontUrl=
titleSize=1.5rem
labelSize=0.9rem
inputSize=1rem
inputPadding=0.75rem
titleWeight=700
labelWeight=600
inputWeight=400
buttonWeight=600
loginTitle=
usernameLabel=
passwordLabel=
loginButtonText=
footerText=
logoMaxWidth=180px
logoMaxHeight=80px
logoPositionMode=default
logoMarginTop=
logoMarginBottom=
logoMarginLeft=
logoMarginRight=
logoPosLeft=
logoPosRight=
logoPosTop=
logoPosBottom=
cardMaxWidth=420px
cardPadding=2.5rem
cardRadius=16px
inputRadius=8px
shadowCard=0 10px 40px rgba(15, 23, 42, 0.08)
btnWidth=100%
btnMinHeight=
btnRadius=
btnTextTransform=none
btnLetterSpacing=
